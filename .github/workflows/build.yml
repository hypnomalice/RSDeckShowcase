# Builds ReSkate.dll and ReSkateLauncher.exe on every push, runs the board turnaround tests, and
# keeps the two files as a download on the run's page (Actions -> the run -> Artifacts).
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Without the Spotify Connect helper: it needs a Rust build of its own.
        run: cmake --preset vs2022-x64 -DDINGOSDK_BUILD_TURNAROUND_TESTS=ON -DDINGOSDK_CARGO=DINGOSDK_CARGO-NOTFOUND

      - name: Build
        run: cmake --build --preset release --parallel 4 --target dingosdk_runtime dingosdk_launcher dingosdk_turnaround_tests

      - name: Test
        run: ctest --test-dir build/vs2022-x64 -C Release -R turnaround --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: ReSkate-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/vs2022-x64/Release/ReSkate.dll
            build/vs2022-x64/Release/ReSkateLauncher.exe
